name: OpenAPI Diff Comment

# Split from oasdiff.yml specifically so this job — the only one that needs a write-capable
# GITHUB_TOKEN — never checks out, fetches, or executes anything from the PR/fork. It only
# downloads the plain-text report artifact that oasdiff.yml (running with a read-only token,
# on `pull_request`) already produced, and posts/updates it as a PR comment. This is GitHub's
# own documented pattern for safely commenting on fork PRs — see:
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
on:
  workflow_run:
    workflows: ["OpenAPI Diff (oasdiff)"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post oasdiff report comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: oasdiff-report
          path: /tmp/oasdiff
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- oasdiff-report -->';
            const prNumber = parseInt(fs.readFileSync('/tmp/oasdiff/pr_number.txt', 'utf8').trim(), 10);
            const body = marker + '\n' + fs.readFileSync('/tmp/oasdiff/report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
